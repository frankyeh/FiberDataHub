name: Plot QC Sample Counts & Publish Chart

on:
  workflow_dispatch:

jobs:
  plot-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Python deps
      run: pip install pandas matplotlib seaborn requests

    - name: Generate QC counts chart
      env:
        PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      run: |
        python plot_qc_counts.py      
        
    - name: Replace QC charts in the qc-chart release
      env:
        GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      run: |
        # plot_qc_counts.py exits before writing any chart when the QC data are missing or incomplete,
        # which fails the step above, so this upload never runs and the published charts stay. --clobber replaces each asset by name
        # (GitHub deletes the old file, then stores the new one), so a request during that swap can still miss.
        shopt -s nullglob
        for f in *.png *.svg; do
          echo "Uploading $f"
          gh release upload qc-chart "$f" --clobber \
            --repo frankyeh/FiberDataHub
        done
  plot-and-publish2:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Python deps
      run: pip install pandas matplotlib seaborn requests

    - name: Generate QC counts chart
      env:
        PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      run: |
        python plot_qc_plots.py        
        
    - name: Remove & Re-upload QC TSVs via GH CLI
      # deletes each chart before re-uploading it, so its URL is missing until the upload finishes
      env:
        GH_TOKEN: ${{ secrets.PAT_TOKEN }}
      run: |
        for f in *.png; do
          echo "🗑  Deleting if-exists $f"
          gh release delete-asset qc-chart "$f" \
            --repo frankyeh/FiberDataHub -y || true

          echo "⬆️  Uploading $f"
          gh release upload qc-chart "$f" \
            --repo frankyeh/FiberDataHub
        done
